name: DailyReport

# 每天 UTC 23:00 触发 = 北京时间 07:00，抓取前一天的数据
# 也可手动触发 (workflow_dispatch)
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: daily-report-${{ github.ref }}
  cancel-in-progress: false   # 不取消正在跑的，避免重复触发导致丢失

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # 从 10 → 20，AI 增强多了 4 次调用留足余量

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          fc-cache -fv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        run: python main.py
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # AI 增强（可选：配了 Key 自动启用，没配就跳过）
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}

      - name: Upload artifacts
        if: always()  # 无论成功失败都上传，方便排查
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            output/*.pdf
            run.log
          if-no-files-found: warn
