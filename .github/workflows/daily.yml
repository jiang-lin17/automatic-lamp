名称: 每日备考资料

开启:
  schedule:
    - cron: '0 23 * * *'
 workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
步骤:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        使用:
          Python 版本: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-microhei
      - run: pip install -r requirements.txt
      - run: python main.py
        环境:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      - 使用: actions/upload-artifact@v4
        如果: 始终()
        使用:
          名称: 每日备考资料
          路径: output/*.pdf
          保留天数: 30
