name: DailyReport
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y fonts-wqy-microhei
      - run: pip install requests beautifulsoup4 reportlab
      - run: python main.py
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: output/*.pdf
