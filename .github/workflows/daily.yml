name: DailyReport

# 每天 UTC 23:00 触发 = 北京时间 07:00，抓取前一天的数据
# 也可手动触发 (workflow_dispatch)
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 超时保护，避免卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'       # ⬅️ 新增：自动缓存 pip 依赖，下次秒装

      - name: Install Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          fc-cache -fv

      - name: Install dependencies
        run: pip install -r requirements.txt  # ⬅️ 改为用 requirements.txt

      - name: Run main.py
        run: python main.py
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # AI 增强（可选：配了 Key 自动启用，没配就跳过）
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}

      - name: Upload artifacts
        if: always()  # 无论成功失败都上传，方便排查
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            output/*.pdf
            run.log
          if-no-files-found: warn
